version: '3.8'

services:
  file-server:
    build: .
    container_name: file-upload-server
    ports:
      - "3001:3001"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=3001
      - UPLOAD_DIR=uploads
      - MAX_FILE_SIZE=10485760
      - MAX_FILES=5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - file-server-network

networks:
  file-server-network:
    driver: bridge